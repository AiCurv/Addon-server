name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        run: |
          # Use the Gradle distribution directly to generate a valid wrapper
          gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addon-server-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addon-server-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Check APK architecture
        if: always()
        run: |
          echo "=== Checking APK architecture ==="
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "APK: $APK_FILE"
            unzip -l "$APK_FILE" | grep "lib/" || echo "Checking native libs..."
            echo "---"
            echo "APK size: $(du -h "$APK_FILE" | cut -f1)"
          else
            echo "No APK found - checking build outputs"
            find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APKs at all"
          fi
